name: CI Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get version
        run: TALKBACK_VERSION=$(cat package.json | jq -r '.version') && echo "TALKBACK_VERSION=$TALKBACK_VERSION" >> $GITHUB_ENV && echo $TALKBACK_VERSION
      - name: Use Node.js from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - name: Save artifact
        if: ${{ success() && contains(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: talkback-dist-${{ env.TALKBACK_VERSION }}
          path: ./dist
          retention-days: 1
  publish:
    needs: build
    if: ${{ success() && contains(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get version
        run: TALKBACK_VERSION=$(cat package.json | jq -r '.version') && echo "TALKBACK_VERSION=$TALKBACK_VERSION" >> $GITHUB_ENV && echo $TALKBACK_VERSION
      - name: Use Node.js from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v6
      - uses: actions/download-artifact@v8
        with:
          name: talkback-dist-${{ env.TALKBACK_VERSION }}
          path: ./dist
      - run: pnpm publish --no-git-checks
        working-directory: dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
